name: Kontroly zdrojů a instalátoru

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Závislosti testů zdrojového balení
        run: python -m pip install PyYAML
      - name: Python syntaxe
        run: python -m compileall -q guest host tests
      - name: Bash syntaxe
        shell: bash
        run: |
          for script in install.sh host/bootstrap.sh host/linux-exam guest/provision.sh guest/test.sh guest/shell.sh guest/starttest guest/statstest guest/zadanitest guest/pomoc-test guest/vysledektest guest/bashrc; do
            bash -n "$script"
          done
      - name: C pomocník pro signály
        run: cc -Wall -Wextra -Werror -fsyntax-only guest/process.c
      - name: Sedmnáct nedestruktivních regresí validátorů
        run: python tests/validators-regression.py
      - name: Regrese obecného auditu hostitele bez zásahů do hosta
        run: python tests/audit_test.py
      - name: Obnovitelné a rychlé přepínání rozhraní
        run: python tests/navigation_test.py
      - name: Předběžná kontrola a balení instalátoru
        run: python tests/installer_test.py
